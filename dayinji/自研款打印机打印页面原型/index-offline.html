<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5fa">
  <title>打印机离线状态 · 自研款打印机打印页面原型</title>
  <!-- 复用在线工作台的设备框 / 头部 / 摄像头裁切 / 底部导航 / Toast / 复用整图页样式（只引用，不修改）；
       离线态专属规则全部收在 styles-offline.css 的专属类名作用域内 -->
  <link rel="stylesheet" href="styles.css?v=r017">
  <link rel="stylesheet" href="styles-offline.css?v=r003">
  <link rel="stylesheet" href="styles-simulation.css?v=r003">
  <link rel="stylesheet" href="styles-connection.css?v=1">
</head>
<body data-connection-page="offline">
  <main id="device-page" class="phone-shell" aria-label="自研款 3D 打印机设备页 · 打印机离线状态">
    <header class="printer-header" aria-label="打印机连接状态">
      <div class="source-crop source-crop--header" aria-hidden="true">
        <img src="../../ugee/Ugee打印机页面原型/assets/ugee-page-1.jpg" alt="">
      </div>

      <!-- 1 · 连接状态置灰：离线小图（灰色● + 「离线」文字）覆盖底图烘焙的「● 忙碌」 -->
      <div id="printer-connection-state" class="printer-connection-state" data-connection-status="offline" role="status" aria-live="polite">
        <img id="printer-connection-state-image" src="../../src/lianjiezhuangtai/离线.png" alt="离线状态">
        <span id="printer-connection-state-label" class="sr-only">离线</span>
      </div>

      <!-- 1b · 「离线」右侧的蓝色刷新按钮：点击走重新连接分支 -->
      <button id="connection-refresh" class="connection-refresh" type="button" aria-label="重新连接打印机">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"></path>
          <path d="M21 3v5h-5"></path>
        </svg>
      </button>

      <!-- 1c · 恢复原打印页顶部右侧两个入口（位置与在线工作台一致）：
             添加打印机 → 添加打印机页；设备设置 → 设备设置页 -->
      <button id="printer-switch" class="hotspot hotspot--switch" type="button" aria-label="添加打印机"></button>
      <button id="printer-settings" class="hotspot hotspot--settings" type="button" aria-label="打开设备设置"></button>
    </header>

    <div class="page-content">
      <!-- 2 · 摄像头处于关闭状态：复用「关闭摄像头状态.jpg」，离线时不提供任何摄像头交互 -->
      <section id="camera-offline" class="source-crop source-crop--timelapse" data-camera-state="off" aria-label="摄像头已关闭">
        <img id="camera-monitor-image" src="../../src/shexiangtou/关闭摄像头状态.jpg" alt="摄像头已关闭">
      </section>

      <!-- 3+4 · 移除原任务控制面板与耗材面板，改为离线态说明卡片 -->
      <section class="offline-notice" aria-label="打印机离线提示">
        <span class="offline-notice-art" aria-hidden="true">
          <!-- 3D 打印机插画（产品渲染 + 斜杠）：assets/离线说明-3D打印机.png，
               由 assets/_tools_make_offline_notice_asset.py 生成 -->
          <img src="assets/离线说明-3D打印机.png" alt="">
        </span>
        <p class="offline-notice-copy">当前打印机处于离线状态，请重新连接打印机。</p>
        <button id="reconnect-button" class="offline-reconnect" type="button">重新连接</button>
        <p id="offline-troubleshooting" class="offline-troubleshooting"></p>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <div class="source-crop source-crop--nav" aria-hidden="true"><img src="../../ugee/Ugee打印机页面原型/assets/ugee-page-2.jpg" alt=""></div>
    </nav>
  </main>

  <!-- 添加打印机页（复用 添加打印机.png）：由顶部「添加打印机」入口打开。
       样式与热区坐标全部复用在线工作台的 .reuse-screen / .reuse-hotspot--*（styles.css），
       页面行为按离线态裁剪：底部「配置新的打印机」前往配网流程第一步骤页；
       在线版的「分享打印机」入口属于分享模块，本分支页不带。 -->
  <section id="add-printer-screen" class="reuse-screen" hidden tabindex="-1" aria-label="添加打印机">
    <div class="reuse-screen-frame">
      <div class="reuse-stage" style="--reuse-ratio: 846 / 1720">
        <img src="../../原型修改复用图片资源/添加打印机.png" alt="添加打印机页，包含我的打印机列表与配置新的打印机按钮">
        <button id="configure-new-printer" class="reuse-hotspot reuse-hotspot--configure-printer" type="button" aria-label="配置新的打印机，前往首次配网连接流程"></button>
      </div>
    </div>
    <button id="add-printer-back" class="reuse-screen-back" type="button" aria-label="返回离线工作台"></button>
  </section>

  <!-- 设备设置页（复用 设备设置页.png）：由顶部「设备设置」入口打开。
       页内四行（固件版本 / 打印选项 / 延时摄影 / 移除打印机）都需要与打印机通信，
       离线态暂不可用，点击给出 Toast 说明；左上角热区返回离线工作台。 -->
  <section id="device-settings-screen" class="reuse-screen" hidden tabindex="-1" aria-label="设备设置">
    <div class="reuse-screen-frame">
      <div class="reuse-stage" style="--reuse-ratio: 376 / 809">
        <img src="../../原型修改复用图片资源/设备设置页.png" alt="设备设置页，包含设备名称、固件版本、打印选项与延时摄影">
        <button id="open-firmware-version" class="reuse-hotspot reuse-hotspot--firmware-version" type="button" aria-label="固件版本"></button>
        <button id="open-print-options" class="reuse-hotspot reuse-hotspot--print-options" type="button" aria-label="打印选项"></button>
        <button id="open-timelapse-settings" class="reuse-hotspot reuse-hotspot--timelapse-setting" type="button" aria-label="延时摄影"></button>
        <button id="open-remove-printer" class="reuse-hotspot reuse-hotspot--remove-printer" type="button" aria-label="移除打印机"></button>
      </div>
    </div>
    <button id="device-settings-back" class="reuse-screen-back" type="button" aria-label="返回离线工作台"></button>
  </section>

  <dialog id="reconnect-timeout-dialog" class="app-dialog" aria-labelledby="reconnect-timeout-title" aria-describedby="reconnect-timeout-copy">
    <form method="dialog">
      <h2 id="reconnect-timeout-title">无法连接打印机</h2>
      <p id="reconnect-timeout-copy"></p>
      <div class="dialog-actions">
        <button id="reconnect-dismiss" type="button">取消</button>
        <button id="reconnect-reconfigure" type="button" data-tone="primary">重新配网连接</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="prototype-connection.js?v=2"></script>
</body>
</html>
