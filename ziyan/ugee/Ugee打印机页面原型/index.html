<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5fa">
  <title>Ugee 打印机页面原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone-shell" aria-label="Ugee 打印机设备页">
    <header class="ugee-header" aria-label="打印机状态区域">
      <div class="source-crop source-crop--header" aria-hidden="true">
        <img src="assets/ugee-page-1.jpg" alt="">
      </div>
      <button id="printer-switch" class="hotspot hotspot--switch" type="button" aria-label="切换打印机"></button>
      <button id="printer-settings" class="hotspot hotspot--settings" type="button" aria-label="打印机设置"></button>
    </header>

    <div class="page-content">
      <section id="timelapse-placeholder" class="source-crop source-crop--timelapse" aria-label="延时摄影占位画面">
        <img src="assets/ugee-page-1.jpg" alt="打印机延时摄影画面占位示意">
      </section>

      <section id="task-panel" class="task-panel" aria-labelledby="task-title">
        <div class="task-status"><span class="status-orb">•••</span><span id="task-state">打印中</span></div>

        <div class="task-summary">
          <div class="model-crop" aria-label="打印模型预览">
            <img src="assets/ugee-page-2.jpg" alt="蓝色弹弹车模型">
          </div>
          <div class="task-copy">
            <h1 id="task-title">弹弹车 吉普车_01_092447</h1>
            <p class="task-meta">0.20 mm 层高 · PLA · 42 g</p>
            <div class="task-time-row">
              <div><span class="meta-label">剩余时间</span><strong>03:33:10</strong></div>
              <strong class="task-percent">3%</strong>
            </div>
            <div class="progress-track" role="progressbar" aria-label="打印进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="3">
              <span></span>
            </div>
          </div>
        </div>

        <div class="task-actions" aria-label="打印任务操作">
          <button id="pause-print" class="outline-action outline-action--pause" type="button">
            <span class="action-icon action-icon--pause" aria-hidden="true"></span><span>暂停</span>
          </button>
          <button id="cancel-print" class="outline-action outline-action--cancel" type="button">
            <span class="action-icon action-icon--cancel" aria-hidden="true">×</span><span>取消</span>
          </button>
        </div>

        <button id="queue-toggle" class="queue-toggle" type="button" aria-expanded="false" aria-controls="print-queue">
          <span><strong>打印队列</strong><small>1 个待打印任务</small></span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div id="print-queue" class="print-queue" hidden>
          <article class="queue-item">
            <div class="queue-thumb" aria-hidden="true"></div>
            <div><strong>桌面收纳盒_v3</strong><span>预计 1 h 25 min · PLA · 28 g</span></div>
            <span class="queue-badge">待打印</span>
          </article>
        </div>
      </section>

      <section class="filament-actions" aria-label="耗材控制">
        <button id="feed-filament" class="filament-button" type="button">
          <svg viewBox="0 0 72 64" aria-hidden="true"><path class="filament-arrow" d="M18 15c6-7 14-10 24-8l-5-5m5 5-6 6"/><path d="M14 27h44M20 34h32M28 41h16M32 48h8M36 49v9"/><path d="M29 24h14l-2 10H31z"/></svg>
          <span>进料</span>
        </button>
        <button id="retract-filament" class="filament-button" type="button">
          <svg viewBox="0 0 72 64" aria-hidden="true"><path class="filament-arrow" d="M54 15c-6-7-14-10-24-8l5-5m-5 5 6 6"/><path d="M14 27h44M20 34h32M28 41h16M32 48h8M36 49v9"/><path d="M29 24h14l-2 10H31z"/></svg>
          <span>退料</span>
        </button>
      </section>

      <section class="controls-section" aria-labelledby="controls-title">
        <h2 id="controls-title">控制</h2>
        <div id="control-carousel" class="control-carousel" role="region" aria-label="打印机控制菜单，可左右拖动">
          <div class="control-track">
            <article class="control-item" data-control="cabin-light">
              <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="7" width="34" height="34" rx="9"/><path d="M18 22a6 6 0 1 1 12 0c0 3-2 4-3 6h-6c-1-2-3-3-3-6Zm4 10h4"/><path d="M24 11v3m-10 3 3 2m17-2-3 2"/></svg>
              <strong>舱内灯</strong>
              <button class="switch is-on" type="button" aria-label="关闭舱内灯" aria-pressed="true"><span></span></button>
            </article>
            <article class="control-item" data-control="outer-light">
              <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="14" width="30" height="28" rx="7"/><path d="M18 10v-3m6 3V6m6 4V7M20 34h8"/></svg>
              <strong>舱外灯</strong>
              <button class="switch is-on" type="button" aria-label="关闭舱外灯" aria-pressed="true"><span></span></button>
            </article>
            <article class="control-item" data-control="fan">
              <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="4"/><path d="M24 20c-3-8 1-13 6-12 5 2 4 9-2 14M28 24c8-3 13 1 12 6-2 5-9 4-14-2M24 28c3 8-1 13-6 12-5-2-4-9 2-14M20 24c-8 3-13-1-12-6 2-5 9-4 14 2"/></svg>
              <strong>风扇</strong>
              <button class="switch is-on" type="button" aria-label="关闭风扇" aria-pressed="true"><span></span></button>
            </article>
            <article class="control-item" data-control="sound">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 20h8l9-8v24l-9-8h-8z"/><path d="M32 19c3 3 3 7 0 10m4-14c6 5 6 13 0 18"/></svg>
              <strong>提示音</strong>
              <button class="switch is-on" type="button" aria-label="关闭提示音" aria-pressed="true"><span></span></button>
            </article>
          </div>
        </div>
        <div class="carousel-dots" aria-label="控制菜单分页"><span class="is-active"></span><span></span></div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <div class="source-crop source-crop--nav" aria-hidden="true"><img src="assets/ugee-page-2.jpg" alt=""></div>
    </nav>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="action-dialog" class="app-dialog">
    <form method="dialog">
      <h2 id="dialog-title">确认操作</h2>
      <p id="dialog-copy"></p>
      <div class="dialog-actions"><button value="cancel">暂不</button><button id="dialog-confirm" value="confirm">确认</button></div>
    </form>
  </dialog>

  <script src="prototype.js"></script>
</body>
</html>
